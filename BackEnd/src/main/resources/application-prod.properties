# ===== Perfil de producción =====
# Se activa con la variable de entorno SPRING_PROFILES_ACTIVE=prod.
# Sobrescribe application.properties. Las propiedades sin valor por defecto
# (${VAR} a secas) son obligatorias: si falta la variable de entorno, la
# aplicación NO arranca. Es intencionado, para no desplegar nunca con los
# secretos de desarrollo.

# ===== Base de datos =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ===== Email =====
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

# ===== JWT =====
# Genera uno con: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET}

# ===== CORS y URLs del frontend =====
# Si el frontend se sirve desde el mismo dominio (Nginx haciendo de proxy de
# /api), basta con poner aquí ese dominio, p. ej. https://prestarte.es
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.frontend.base-url=${FRONTEND_BASE_URL}

# ===== Admin inicial =====
app.admin.email=${ADMIN_EMAIL}
app.admin.password=${ADMIN_PASSWORD}

# ===== Datos de demo =====
app.seed-test-data=false

# ===== Proxy inverso =====
# Hace que request.getRemoteAddr() devuelva la IP real del cliente cuando hay
# un Nginx/Caddy delante (lo necesita el límite de intentos del login).
server.forward-headers-strategy=native

# ===== Errores =====
# No devolver trazas ni mensajes internos al cliente.
server.error.include-stacktrace=never
server.error.include-message=never
