spring.application.name=prestarte

# ===== Base de datos =====
spring.datasource.url=jdbc:mysql://localhost:3306/prestarte?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
# Logging de SQL desactivado: con el polling del chat (cada 4 s) y el de
# notificaciones (cada 60 s) la consola se llenaba sin parar. Si necesitas
# depurar consultas, vuelve a poner show-sql=true puntualmente.
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

spring.jackson.serialization.fail-on-empty-beans=false

# ===== Subida de archivos =====
spring.servlet.multipart.max-file-size=10MB
# Una petición puede llevar varias fotos (informes de estado: hasta 10).
spring.servlet.multipart.max-request-size=60MB

# ===== Email (Gmail SMTP) =====
# Las credenciales NUNCA van en este fichero. En local, defínelas como variables
# de entorno SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD; en producción las exige
# application-prod.properties (MAIL_USERNAME / MAIL_PASSWORD).
spring.mail.host=smtp.gmail.com
spring.mail.port=587

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== JWT =====
# Secret en Base64 (mínimo 256 bits / 44 chars en base64).
# El valor por defecto es solo para desarrollo; con el perfil "prod" la variable
# JWT_SECRET es obligatoria (ver application-prod.properties).
# Comando para generar uno nuevo: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2QtY2hhbmdlLW1lLWluLXByb2QtY2hhbmdlLW1lLWluLXByb2QtY2hhbmdlLW1lLWluLXByb2Q=}
app.jwt.expiration-ms=86400000

# ===== CORS =====
# Frontend Angular en desarrollo
app.cors.allowed-origins=http://localhost:4200

# URL base del frontend, usada en los enlaces dentro de los emails (ej. reset-password).
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}

# ===== Admin seed =====
# Se crea al arrancar si no existe. Cámbialo en producción.
app.admin.email=${ADMIN_EMAIL:admin@prestarte.local}
app.admin.password=${ADMIN_PASSWORD:Admin1234!}
app.admin.name=Administrador Prestarte

# ===== Datos de prueba (DEMO) =====
# Si es true, al arrancar se crean: 1 collector, 1 foundation, 1 transport, 1 artwork y 1 loan.
# Idempotente: solo se siembran si no existen ya. Pon 'false' para producción.
app.seed-test-data=true

# Contenido de los archivos subidos (fotos, documentos): en disco, no en MySQL.
app.storage.dir=${APP_STORAGE_DIR:./data/files}
# true para mover a disco los archivos antiguos guardados en la base de datos.
app.storage.migrate-legacy=${APP_STORAGE_MIGRATE_LEGACY:false}

# Geocodificación de ciudades que no están en la tabla local (Nominatim / OpenStreetMap).
app.geocoding.enabled=${APP_GEOCODING_ENABLED:true}
app.geocoding.url=${APP_GEOCODING_URL:https://nominatim.openstreetmap.org}
