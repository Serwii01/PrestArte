spring.application.name=prestarte

# ===== Base de datos =====
spring.datasource.url=jdbc:mysql://localhost:3306/prestarte?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
# ↑ TEMPORAL: borra y recrea el schema en cada arranque. Devolver a 'update' tras 2.2.a.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.serialization.fail-on-empty-beans=false

# ===== Subida de archivos =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Email (Gmail SMTP) =====
# IMPORTANTE: usa variables de entorno en lugar de hardcodear el password.
# Crea las env vars MAIL_USERNAME y MAIL_PASSWORD en tu sistema (o en la run config de IntelliJ).
# El App Password actual está committeado al repo: revócalo en tu cuenta de Google y genera uno nuevo.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:sfmrbb@gmail.com}
spring.mail.password=${MAIL_PASSWORD:CHANGE_ME}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===== JWT =====
# Secret en Base64 (mínimo 256 bits / 44 chars en base64).
# Generado de prueba para desarrollo: CAMBIAR antes de cualquier despliegue público.
# Comando para generar uno nuevo: openssl rand -base64 64
app.jwt.secret=${JWT_SECRET:Y2hhbmdlLW1lLWluLXByb2QtY2hhbmdlLW1lLWluLXByb2QtY2hhbmdlLW1lLWluLXByb2QtY2hhbmdlLW1lLWluLXByb2Q=}
app.jwt.expiration-ms=86400000

# ===== CORS =====
# Frontend Angular en desarrollo
app.cors.allowed-origins=http://localhost:4200

# ===== Admin seed =====
# Se crea al arrancar si no existe. Cámbialo en producción.
app.admin.email=${ADMIN_EMAIL:admin@prestarte.local}
app.admin.password=${ADMIN_PASSWORD:Admin1234!}
app.admin.name=Administrador Prestarte

# ===== Datos de prueba (DEMO) =====
# Si es true, al arrancar se crean: 1 collector, 1 foundation, 1 transport, 1 artwork y 1 loan.
# Idempotente: solo se siembran si no existen ya. Pon 'false' para producción.
app.seed-test-data=true
