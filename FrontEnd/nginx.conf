server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las subidas con varias fotos (informes de estado) pueden pesar bastante.
    client_max_body_size 60m;

    # Cabeceras de seguridad básicas.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API: se reenvía al backend. Las cabeceras X-Forwarded-* permiten que
    # Spring vea la IP real del cliente (límite de intentos del login).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Ficheros con hash en el nombre: caché larga.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Aplicación Angular (rutas del cliente).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
